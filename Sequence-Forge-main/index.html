<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Rhythm</title>
  <meta name="description" content="Build. Flow. Recover. — 编排你的训练流程">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ============================================================ -->
  <!-- 视图 1: 主页 (卡片仪表盘)                                      -->
  <!-- ============================================================ -->
  <section id="view-home" class="view active">
    <header class="app-header">
      <h1>🎵 Rhythm</h1>
      <span class="subtitle">Build. Flow. Recover.</span>
    </header>

    <!-- 快速开始按钮 -->
    <div class="quick-start-wrap">
      <button id="btn-quick-start" class="btn quick-start-btn">🧘 快速训练</button>
    </div>

    <main class="home-main">
      <div id="routine-list" class="card-list">
        <div class="empty-state">没有训练组，点击下方创建</div>
      </div>
    </main>

    <footer class="home-footer">
      <button id="btn-manage-projects" class="btn secondary">📋 管理动作</button>
      <button id="btn-new-routine" class="btn primary">📝 新建训练组</button>
      <button id="btn-speech-toggle" class="btn secondary" style="flex:0.6;">🗣️ 语音 ON</button>
      <button id="btn-export-data" class="btn secondary" style="flex:0.6;">⬇️ 导出</button>
      <button id="btn-import-data" class="btn secondary" style="flex:0.6;">⬆️ 导入</button>
    </footer>
  </section>

  <!-- ============================================================ -->
  <!-- 视图 2: 动作设定页                                             -->
  <!-- ============================================================ -->
  <section id="view-projects" class="view">
    <header class="view-header">
      <button class="btn-back" data-target="home">← 返回</button>
      <h2>动作库</h2>
      <button id="btn-new-project" class="btn-icon">＋ 新建动作</button>
    </header>

    <main class="project-list" id="project-list">
      <div class="empty-state">还没有动作，点击「新建动作」创建</div>
    </main>

    <!-- 动作编辑抽屉 -->
    <div id="project-drawer" class="drawer">
      <div class="drawer-content">
        <h3 id="project-drawer-title">编辑动作</h3>
        <div class="drawer-body">
          <div class="field">
            <label>动作名</label>
            <input type="text" id="project-name" placeholder="例如：慢深蹲">
          </div>

          <div class="field">
            <label>相位序列</label>
            <div id="phase-list" class="phase-chip-list"></div>
            <div class="phase-add-buttons">
              <button class="btn-chip" data-phase="up">＋ up</button>
              <button class="btn-chip" data-phase="hold">＋ hold</button>
              <button class="btn-chip" data-phase="down">＋ down</button>
            </div>
          </div>

          <div class="field">
            <label>配图</label>
            <div class="image-upload-area">
              <input type="file" id="project-image-input" accept="image/*">
              <div id="project-image-preview" class="image-preview"></div>
              <button id="btn-remove-image" class="btn-sm danger">移除图片</button>
            </div>
          </div>

          <div class="field">
            <label>默认备注</label>
            <textarea id="project-note" rows="2" placeholder="动作要领或提示…"></textarea>
          </div>
        </div>
        <div class="drawer-footer">
          <button id="btn-project-cancel" class="btn secondary">取消</button>
          <button id="btn-project-save" class="btn primary">💾 保存</button>
        </div>
      </div>
      <div class="drawer-overlay"></div>
    </div>
  </section>

  <!-- ============================================================ -->
  <!-- 视图 3: 训练组设定页                                           -->
  <!-- ============================================================ -->
  <section id="view-routines" class="view">
    <header class="view-header">
      <button class="btn-back" data-target="home">← 返回</button>
      <h2 id="routine-editor-title">编辑训练组</h2>
      <button id="btn-save-routine" class="btn-icon">💾 保存</button>
    </header>

    <main class="routine-editor">
      <div class="routine-meta">
        <div class="field">
          <label>组名</label>
          <input type="text" id="routine-name" placeholder="例如：腿部轰炸日">
        </div>
        <div class="field-row">
          <div class="field">
            <label>循环次数</label>
            <div class="stepper">
              <button class="btn-stepper" data-target="rounds" data-dir="-1">−</button>
              <span id="routine-rounds">3</span>
              <button class="btn-stepper" data-target="rounds" data-dir="1">＋</button>
            </div>
          </div>
          <div class="field">
            <label>开始倒计时</label>
            <div class="slider-box">
              <input type="range" id="routine-countdown" min="0" max="10" step="1" value="3">
              <span id="routine-countdown-val">3 s</span>
            </div>
          </div>
        </div>
      </div>

      <div id="step-list" class="step-timeline">
        <div class="empty-state">点击下方添加步骤</div>
      </div>

      <div class="step-append-buttons">
        <button id="btn-append-project" class="btn secondary">＋ 追加动作</button>
        <button id="btn-append-rest" class="btn secondary">＋ 追加休息</button>
      </div>
    </main>
  </section>

  <!-- ============================================================ -->
  <!-- 视图 4: 训练执行页 (四分位布局)                               -->
  <!-- ============================================================ -->
  <section id="view-training" class="view">
    <header class="training-header">
      <button id="btn-training-back" class="btn-icon">✕</button>
      <span id="training-title" class="training-title">训练组名</span>
      <span id="training-progress" class="training-progress">准备中…</span>
    </header>

    <main class="training-main">
      <div class="quadrant top-left">
        <div id="training-project-name" class="project-name">准备</div>
        <div id="training-phase-label" class="phase-label"></div>
        <div id="training-note" class="training-note"></div>
      </div>

      <div class="quadrant top-right">
        <div id="training-image" class="training-image">
          <img id="training-image-img" src="" alt="动作配图">
        </div>
      </div>

      <div class="quadrant bottom-left">
        <div id="training-countdown" class="countdown-big">0.0</div>
        <div class="countdown-label">剩余时间</div>
      </div>

      <div class="quadrant bottom-right">
        <div class="circle-wrap">
          <svg viewBox="0 0 240 240">
            <circle id="breath-circle" cx="120" cy="120" r="20" fill="rgba(200,60,60,0.6)"/>
          </svg>
        </div>
      </div>
    </main>

    <footer class="training-footer">
      <div class="progress-bar">
        <div id="training-total-progress" class="progress-fill" style="width: 0%"></div>
      </div>

      <!-- 音效 + 语音开关行 -->
      <div class="training-switches">
        <button id="btn-training-sound" class="toggle-switch on">🔊 音效</button>
        <button id="btn-training-voice" class="toggle-switch on">🗣️ 语音</button>
      </div>

      <div class="training-controls">
        <button id="btn-training-start" class="btn primary">▶ 开始</button>
        <button id="btn-training-pause" class="btn primary hidden">⏸ 暂停</button>
        <button id="btn-training-resume" class="btn primary hidden">▶ 继续</button>
        <button id="btn-training-stop" class="btn danger hidden">⏹ 结束</button>
      </div>
      <div class="training-shortcuts">空格 控制 · ESC 退出</div>
    </footer>
  </section>

  <!-- ============================================================ -->
  <!-- 视图 5: 呼吸训练 (快速开始)                                   -->
  <!-- ============================================================ -->
  <section id="view-breath" class="view">
    <!-- 设置界面 -->
    <div id="breath-setup" class="breath-setup">
      <header class="view-header">
        <button class="btn-back" data-target="home">← 返回</button>
        <h2>🧘 快速训练</h2>
      </header>

      <main class="breath-main">
        <div class="breath-sliders">
          <div class="breath-slider-row">
            <label>In</label>
            <div class="slider-box">
              <input type="range" id="breath-inhale" min="0.5" max="15" step="0.5" value="4">
              <span id="breath-inhale-val">4.0 s</span>
            </div>
          </div>
          <div class="breath-slider-row">
            <label>InHold</label>
            <div class="slider-box">
              <input type="range" id="breath-hold" min="0" max="15" step="0.5" value="7">
              <span id="breath-hold-val">7.0 s</span>
            </div>
          </div>
          <div class="breath-slider-row">
            <label>Out</label>
            <div class="slider-box">
              <input type="range" id="breath-exhale" min="0.5" max="15" step="0.5" value="8">
              <span id="breath-exhale-val">8.0 s</span>
            </div>
          </div>
          <div class="breath-slider-row">
            <label>OutHold</label>
            <div class="slider-box">
              <input type="range" id="breath-exhale-hold" min="0" max="10" step="0.5" value="0">
              <span id="breath-exhale-hold-val">0.0 s</span>
            </div>
          </div>
          <div class="breath-slider-row">
            <label>倒计时</label>
            <div class="slider-box">
              <input type="range" id="breath-countdown" min="0" max="10" step="1" value="3">
              <span id="breath-countdown-val">3 s</span>
            </div>
          </div>
        </div>

        <div class="breath-mode-wrap">
          <div class="breath-mode-toggle">
            <button id="breath-mode-count" class="btn-mode active">按次数</button>
            <button id="breath-mode-time" class="btn-mode">按时间</button>
          </div>
          <div id="breath-count-control" class="breath-count-control">
            <label>循环次数</label>
            <div class="slider-box">
              <input type="range" id="breath-count" min="1" max="50" step="1" value="10">
              <span id="breath-count-val">10 次</span>
            </div>
          </div>
          <div id="breath-time-control" class="breath-time-control hidden">
            <label>训练时长</label>
            <div class="slider-box">
              <input type="range" id="breath-time" min="1" max="30" step="0.5" value="5">
              <span id="breath-time-val">5.0 min</span>
            </div>
          </div>
        </div>

        <div class="breath-settings-row">
          <button id="breath-sound-toggle" class="toggle on">🔊 声音</button>
          <button id="breath-vibrate-toggle" class="toggle on">📳 振动</button>
        </div>

        <div class="breath-slider-row">
          <label>音量</label>
          <div class="slider-box">
            <input type="range" id="breath-volume" min="0" max="1" step="0.05" value="0.8">
            <span id="breath-volume-val">80%</span>
          </div>
        </div>

        <button id="btn-breath-start" class="btn primary breath-start-btn">▶ 开始训练</button>
      </main>
    </div>

    <!-- 执行界面 -->
    <div id="breath-exec" class="breath-exec hidden">
      <header class="training-header">
        <button id="btn-breath-back" class="btn-icon">✕</button>
        <span class="training-title">🧘 呼吸训练</span>
        <span id="breath-progress" class="training-progress">0/0</span>
      </header>

      <main class="breath-exec-main">
        <div id="breath-phase-name" class="breath-phase-name">准备</div>
        <div id="breath-countdown-big" class="breath-countdown-big">0</div>
        <div class="breath-circle-wrap">
          <svg viewBox="0 0 240 240">
            <circle id="breath-circle-big" cx="120" cy="120" r="20" fill="rgba(200,60,60,0.6)"/>
          </svg>
        </div>
        <div class="breath-exec-info">
          <span id="breath-exec-detail">循环 0/0</span>
          <span id="breath-exec-time">⏱ 00:00</span>
        </div>
        <div class="progress-bar breath-progress-bar">
          <div id="breath-total-progress" class="progress-fill" style="width: 0%"></div>
        </div>
      </main>

      <footer class="training-footer">
        <div class="training-controls">
          <button id="btn-breath-pause" class="btn primary">⏸ 暂停</button>
          <button id="btn-breath-resume" class="btn primary hidden">▶ 继续</button>
          <button id="btn-breath-stop" class="btn danger">⏹ 结束</button>
        </div>
        <div class="training-shortcuts">空格 控制 · ESC 退出</div>
      </footer>
    </div>
  </section>

</div>

<!-- ============================================================ -->
<!-- 安装横幅                                                      -->
<!-- ============================================================ -->
<div id="install-banner">
  <p>安装 Rhythm 到主屏幕，离线也能用</p>
  <button id="btn-install" class="btn-install">安装</button>
  <button id="btn-close-banner" class="btn-close">&times;</button>
</div>

<!-- 脚本加载顺序（注意：app.js 必须在最后） -->
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/audio.js"></script>
<script src="js/training-settings.js"></script>
<script src="js/engine.js"></script>
<script src="js/breath-trainer.js"></script>
<script src="js/ui-router.js"></script>
<script src="js/training-runner.js"></script>
<script src="js/routines-editor.js"></script>
<script src="js/app.js"></script>

</body>
</html>
