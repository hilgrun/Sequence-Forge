<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sequence Forge</title>
  <meta name="description" content="Forge your training sequence">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ============================================================ -->
  <!-- 视图 1: 主页 (卡片仪表盘)                                      -->
  <!-- ============================================================ -->
  <section id="view-home" class="view active">
    <header class="app-header">
      <h1>⛓️ Sequence Forge</h1>
      <span class="subtitle">Build. Flow. Recover.</span>
    </header>

    <main class="home-main">
      <div id="routine-list" class="card-list">
        <div class="empty-state">没有训练组，点击下方创建</div>
      </div>
    </main>

    <footer class="home-footer">
      <button id="btn-manage-projects" class="btn secondary">📋 管理项目</button>
      <button id="btn-new-routine" class="btn primary">📝 新建训练组</button>
      <button id="btn-export-data" class="btn secondary" style="flex:0.6;">⬇️ 导出</button>
      <button id="btn-import-data" class="btn secondary" style="flex:0.6;">⬆️ 导入</button>
    </footer>
  </section>

  <!-- ============================================================ -->
  <!-- 视图 2: 项目设定页                                             -->
  <!-- ============================================================ -->
  <section id="view-projects" class="view">
    <header class="view-header">
      <button class="btn-back" data-target="home">← 返回</button>
      <h2>训练项目</h2>
      <button id="btn-new-project" class="btn-icon">＋ 新建</button>
    </header>

    <main class="project-list" id="project-list">
      <div class="empty-state">还没有项目，点击「新建」创建</div>
    </main>

    <!-- 项目编辑抽屉 -->
    <div id="project-drawer" class="drawer">
      <div class="drawer-content">
        <h3 id="project-drawer-title">编辑项目</h3>
        <div class="drawer-body">
          <div class="field">
            <label>项目名</label>
            <input type="text" id="project-name" placeholder="例如：慢深蹲">
          </div>

          <div class="field">
            <label>相位序列</label>
            <div id="phase-list" class="phase-chip-list"></div>
            <div class="phase-add-buttons">
              <button class="btn-chip" data-phase="up">＋ up</button>
              <button class="btn-chip" data-phase="hold">＋ hold</button>
              <button class="btn-chip" data-phase="down">＋ down</button>
            </div>
          </div>

          <div class="field">
            <label>配图</label>
            <div class="image-upload-area">
              <input type="file" id="project-image-input" accept="image/*">
              <div id="project-image-preview" class="image-preview"></div>
              <button id="btn-remove-image" class="btn-sm danger">移除图片</button>
            </div>
          </div>

          <div class="field">
            <label>默认备注</label>
            <textarea id="project-note" rows="2" placeholder="动作要领或提示…"></textarea>
          </div>
        </div>
        <div class="drawer-footer">
          <button id="btn-project-cancel" class="btn secondary">取消</button>
          <button id="btn-project-save" class="btn primary">💾 保存</button>
        </div>
      </div>
      <div class="drawer-overlay"></div>
    </div>
  </section>

  <!-- ============================================================ -->
  <!-- 视图 3: 训练组设定页 (垂直时间线编辑器)                       -->
  <!-- ============================================================ -->
  <section id="view-routines" class="view">
    <header class="view-header">
      <button class="btn-back" data-target="home">← 返回</button>
      <h2 id="routine-editor-title">编辑训练组</h2>
      <button id="btn-save-routine" class="btn-icon">💾 保存</button>
    </header>

    <main class="routine-editor">
      <!-- 组元数据 -->
      <div class="routine-meta">
        <div class="field">
          <label>组名</label>
          <input type="text" id="routine-name" placeholder="例如：腿部轰炸日">
        </div>
        <div class="field-row">
          <div class="field">
            <label>总循环</label>
            <div class="stepper">
              <button class="btn-stepper" data-target="rounds" data-dir="-1">−</button>
              <span id="routine-rounds">4</span>
              <button class="btn-stepper" data-target="rounds" data-dir="1">＋</button>
            </div>
          </div>
          <div class="field">
            <label>组循环间休息</label>
            <div class="slider-box">
              <input type="range" id="routine-rest-between" min="0" max="15" step="0.5" value="2">
              <span id="routine-rest-between-val">2.0 min</span>
            </div>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>开始倒计时</label>
            <div class="slider-box">
              <input type="range" id="routine-countdown" min="0" max="10" step="1" value="3">
              <span id="routine-countdown-val">3 s</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 时间线步骤列表 -->
      <div id="step-list" class="step-timeline">
        <div class="empty-state">点击下方添加步骤</div>
      </div>

      <!-- 底部追加按钮 -->
      <div class="step-append-buttons">
        <button id="btn-append-project" class="btn secondary">＋ 追加项目</button>
        <button id="btn-append-rest" class="btn secondary">＋ 追加休息</button>
      </div>
    </main>
  </section>

  <!-- ============================================================ -->
  <!-- 视图 4: 训练执行页 (四分位布局)                               -->
  <!-- ============================================================ -->
  <section id="view-training" class="view">
    <header class="training-header">
      <button id="btn-training-back" class="btn-icon">✕</button>
      <span id="training-title" class="training-title">训练组名</span>
      <span id="training-progress" class="training-progress">准备中…</span>
    </header>

    <main class="training-main">
      <div class="quadrant top-left">
        <div id="training-project-name" class="project-name">准备</div>
        <div id="training-phase-label" class="phase-label"></div>
        <div id="training-note" class="training-note"></div>
      </div>

      <div class="quadrant top-right">
        <div id="training-image" class="training-image">
          <img id="training-image-img" src="" alt="项目配图">
        </div>
      </div>

      <div class="quadrant bottom-left">
        <div id="training-countdown" class="countdown-big">0.0</div>
        <div class="countdown-label">剩余时间</div>
      </div>

      <div class="quadrant bottom-right">
        <div class="circle-wrap">
          <svg viewBox="0 0 240 240">
            <circle id="breath-circle" cx="120" cy="120" r="20" fill="rgba(200,60,60,0.6)"/>
          </svg>
        </div>
      </div>
    </main>

    <!-- 训练页底部，确保进度条元素存在 -->
    <footer class="training-footer">
      <div class="progress-bar">
        <div id="training-total-progress" class="progress-fill" style="width: 0%"></div>
      </div>
      <div class="training-controls">
        <button id="btn-training-start" class="btn primary">▶ 开始</button>
        <button id="btn-training-pause" class="btn primary hidden">⏸ 暂停</button>
        <button id="btn-training-resume" class="btn primary hidden">▶ 继续</button>
        <button id="btn-training-stop" class="btn danger hidden">⏹ 结束</button>
      </div>
      <div class="training-shortcuts">
        空格 控制 · ESC 退出
      </div>
    </footer>
  </section>

</div>

<!-- ============================================================ -->
<!-- 安装横幅                                                      -->
<!-- ============================================================ -->
<div id="install-banner">
  <p>安装 Sequence Forge 到主屏幕，离线也能用</p>
  <button id="btn-install" class="btn-install">安装</button>
  <button id="btn-close-banner" class="btn-close">&times;</button>
</div>

<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
